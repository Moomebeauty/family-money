<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  addDoc, deleteDoc, updateDoc, serverTimestamp, query, where, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ══════════════════════════════════════════════════════════════
// FIREBASE CONFIG
// ══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyCnVJQe7pSazJKMNc9XXshWk3S3gk-O2A4",
  authDomain: "money-a362d.firebaseapp.com",
  projectId: "money-a362d",
  storageBucket: "money-a362d.firebasestorage.app",
  messagingSenderId: "884211458396",
  appId: "1:884211458396:web:78e6394bcdf97b666de199"
};
const FAMILY_PASSWORD = "820228";
const FAMILY_ID = "family_main"; // Firestore document ID

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

// ══════════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════════
const USERS = ['伯涵','珞熙','楷宸'];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const CREDIT_CARDS = ['星展','富邦','國泰','台新','中信','永豐','玉山','聯邦','其他'];
const INCOME_CATS = ['薪資','助教費','獎金','投資收益','租金收入','利息','股票股利','其他被動收入','其他'];
const EXPENSE_CATS = ['房租','房貸','車貸','保險工會','交通加油','水費','電費','瓦斯','網路','手機','餐飲','日用品','醫療','娛樂休閒','旅遊','教育進修','孝親費','固定分期','其他'];
const PAY_METHODS = ['現金','轉帳','信用卡'];
const BUDGET_CATS = ['房租','交通加油','保險工會','水電瓦斯','網路通訊','餐飲','日用品','其他備用'];
const ASSET_TYPES = ['股票','ETF','基金','現金存款','定存','不動產','黃金','外幣','其他'];
const DEBT_TYPES = ['房貸','車貸','信用貸款','學貸','信用卡分期','其他'];
const DREAM_ICONS = ['🏠','🚗','✈️','💍','📚','💻','🎓','🏖️','🌏','💰','🏋️','🎸'];
const PAGES = [
  {id:'overview', icon:'📊', label:'總覽'},
  {id:'networth',  icon:'💎', label:'資產負債'},
  {id:'cashflow',  icon:'💵', label:'收入現金流'},
  {id:'expenses',  icon:'🧾', label:'支出記帳'},
  {id:'budget',    icon:'📋', label:'預算管理'},
  {id:'creditcard',icon:'💳', label:'信用卡'},
  {id:'dreams',    icon:'🌟', label:'夢想計畫'},
  {id:'reports',   icon:'📈', label:'年度報表'},
];
const MOBILE_PAGES = ['overview','expenses','creditcard','dreams','reports'];

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let S = {
  loggedIn: false,
  user: '伯涵',
  page: 'overview',
  month: new Date().getMonth() + 1,
  subTab: 0,
  syncStatus: 'idle',
  modal: null,
  // Live data from Firestore
  data: {
    assets: [],
    debts: [],
    incomes: [],
    expenses: [],
    budgets: {},
    dreams: [],
    yearNotes: {}
  }
};

// ══════════════════════════════════════════════════════════════
// FIREBASE REALTIME LISTENER
// ══════════════════════════════════════════════════════════════
let unsubscribers = [];

function startRealtimeSync() {
  setSyncStatus('syncing');
  // Listen to main family doc (assets, debts, budgets, dreams, yearNotes)
  const mainRef = doc(db, 'families', FAMILY_ID);
  const u1 = onSnapshot(mainRef, snap => {
    if (snap.exists()) {
      const d = snap.data();
      S.data.assets = d.assets || [];
      S.data.debts = d.debts || [];
      S.data.budgets = d.budgets || {};
      S.data.dreams = d.dreams || [];
      S.data.yearNotes = d.yearNotes || {};
    }
    setSyncStatus('synced');
    if (S.loggedIn) render();
  }, () => setSyncStatus('error'));

  // Listen to incomes collection
  const incomesRef = collection(db, 'families', FAMILY_ID, 'incomes');
  const u2 = onSnapshot(query(incomesRef), snap => {
    S.data.incomes = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if (S.loggedIn) render();
  });

  // Listen to expenses collection
  const expensesRef = collection(db, 'families', FAMILY_ID, 'expenses');
  const u3 = onSnapshot(query(expensesRef), snap => {
    S.data.expenses = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if (S.loggedIn) render();
  });

  unsubscribers = [u1, u2, u3];
}

// ══════════════════════════════════════════════════════════════
// SAVE HELPERS
// ══════════════════════════════════════════════════════════════
async function saveMainDoc(patch) {
  setSyncStatus('syncing');
  try {
    const ref = doc(db, 'families', FAMILY_ID);
    await setDoc(ref, patch, { merge: true });
    setSyncStatus('synced');
  } catch(e) { setSyncStatus('error'); showToast('儲存失敗，請檢查網路'); }
}
async function addSubDoc(col, data) {
  setSyncStatus('syncing');
  try {
    await addDoc(collection(db, 'families', FAMILY_ID, col), {...data, createdAt: serverTimestamp()});
    setSyncStatus('synced');
  } catch(e) { setSyncStatus('error'); showToast('儲存失敗'); }
}
async function delSubDoc(col, id) {
  setSyncStatus('syncing');
  try {
    await deleteDoc(doc(db, 'families', FAMILY_ID, col, id));
    setSyncStatus('synced');
  } catch(e) { setSyncStatus('error'); showToast('刪除失敗'); }
}

// ══════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function fmt(n) { return Number(n||0).toLocaleString('zh-TW'); }
function toNum(v) { return parseFloat(String(v||0).replace(/,/g,''))||0; }
function todayStr() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function curYear() { return new Date().getFullYear(); }
function mKey() { return `${curYear()}-${String(S.month).padStart(2,'0')}`; }
function setSyncStatus(s) {
  S.syncStatus = s;
  const dot = document.querySelector('.sync-dot');
  const lbl = document.querySelector('.sync-label');
  if(dot) { dot.className='sync-dot '+s; }
  if(lbl) { lbl.textContent = s==='synced'?'已同步':s==='syncing'?'同步中…':s==='error'?'離線':''; }
}
function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2500);
}
function getIncomes(allUsers) {
  return S.data.incomes.filter(i =>
    i.month === S.month && i.year === curYear() &&
    (allUsers || S.user==='全部' || i.user === S.user)
  );
}
function getExpenses(allUsers) {
  return S.data.expenses.filter(e =>
    e.month === S.month && e.year === curYear() &&
    (allUsers || S.user==='全部' || e.user === S.user)
  );
}

// PAGES
// ══════════════════════════════════════════════════════════════
function buildPage() {
  switch(S.page) {
    case 'overview':    return pageOverview();
    case 'networth':    return pageNetworth();
    case 'cashflow':    return pageCashflow();
    case 'expenses':    return pageExpenses();
    case 'budget':      return pageBudget();

// ── OVERVIEW ─────────────────────────────────────────────────
function pageOverview() {
  const inc = getIncomes(true), exp = getExpenses(true);
  const myInc = getIncomes(false), myExp = getExpenses(false);
  const totalInc = inc.reduce((s,i)=>s+toNum(i.amount),0);
  const totalExp = exp.reduce((s,e)=>s+toNum(e.amount),0);
  const net = totalInc - totalExp;
  const totalAssets = S.data.assets.reduce((s,a)=>s+toNum(a.value),0);
  const totalDebts = S.data.debts.reduce((s,d)=>s+toNum(d.remainingAmount),0);
  const netWorth = totalAssets - totalDebts;
  const myI = myInc.reduce((s,i)=>s+toNum(i.amount),0);
  const myE = myExp.reduce((s,e)=>s+toNum(e.amount),0);
  const budgets = (S.data.budgets||{})[mKey()]||{};
  const budgetTotal = Object.values(budgets).reduce((s,v)=>s+toNum(v),0);
  const budgetUsed = exp.reduce((s,e)=>s+toNum(e.amount),0);
  const bpct = budgetTotal>0?Math.min(100,Math.round(budgetUsed/budgetTotal*100)):0;
  const bcol = bpct>90?'var(--red)':bpct>70?'var(--yellow-border)':'var(--green)';
  const dreams = (S.data.dreams||[]).filter(d=>toNum(d.savedAmount)<toNum(d.targetAmount));

  return `
  <div class="page-title">📊 財務總覽</div>
  <div class="page-sub">${curYear()}年 ${MONTHS[S.month-1]} — 查看中：${S.user}</div>
  ${buildMonthSel()}
  <div class="stat-grid sg4">
    <div class="stat-card green"><div class="stat-label">家庭總收入</div><div class="stat-value green">$${fmt(totalInc)}</div><div class="stat-sub">${S.user} 貢獻 $${fmt(myI)}</div></div>
    <div class="stat-card red"><div class="stat-label">家庭總支出</div><div class="stat-value red">$${fmt(totalExp)}</div><div class="stat-sub">${S.user} 支出 $${fmt(myE)}</div></div>
    <div class="stat-card ${net>=0?'green':'red'}"><div class="stat-label">本月淨結餘</div><div class="stat-value ${net>=0?'green':'red'}">$${fmt(net)}</div><div class="stat-sub">${net>=0?'💚 有結餘！':'🔴 超支了'}</div></div>
    <div class="stat-card blue"><div class="stat-label">家庭淨資產</div><div class="stat-value blue sm">$${fmt(netWorth)}</div><div class="stat-sub">資產 $${fmt(totalAssets)} ／ 負債 $${fmt(totalDebts)}</div></div>
  </div>
  <div class="stat-grid sg2">
    <div class="card">
      <div class="card-header"><span class="card-title">📋 預算使用進度</span><button class="btn btn-secondary btn-sm" onclick="setPage('budget')">管理</button></div>
      <div class="card-body">
        <div class="prog-labels"><span>已用 $${fmt(budgetUsed)}</span><span>預算 $${fmt(budgetTotal)}</span></div>
        <div class="progress-bg" style="height:18px;"><div class="progress-fill" style="width:${bpct}%;background:${bcol};height:18px;"></div></div>
        <div style="text-align:right;font-size:12px;font-weight:700;color:var(--brown);margin-top:4px;">${bpct}%</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">🌟 夢想進度</span><button class="btn btn-secondary btn-sm" onclick="setPage('dreams')">查看</button></div>
      <div class="card-body">
        ${dreams.length===0?'<div class="empty" style="padding:12px 0;"><p>尚無進行中的夢想</p></div>':
          dreams.slice(0,3).map(dr=>{
            const pct=toNum(dr.targetAmount)>0?Math.min(100,Math.round(toNum(dr.savedAmount)/toNum(dr.targetAmount)*100)):0;
            return `<div class="mb-12">
              <div class="flex-between mb-12" style="margin-bottom:5px;"><span style="font-weight:700;font-size:13px;">${dr.icon||'🎯'} ${dr.name}</span><span class="text-muted">${pct}%</span></div>

            </div>`;

      </div>

    <div class="card-header">

  return `

      return `<div class="card" style="border-left:4px solid ${col};">

// ── REPORTS ──────────────────────────────────────────────────
function pageReports() {
  const months = Array.from({length:12},(_,i)=>i+1);
  const md = months.map(m=>{
    const mI = S.data.incomes.filter(i=>i.month===m&&i.year===curYear());
    const mE = S.data.expenses.filter(e=>e.month===m&&e.year===curYear());
    const inc=mI.reduce((s,i)=>s+toNum(i.amount),0);
    const exp=mE.reduce((s,e)=>s+toNum(e.amount),0);
    return {m,inc,exp,net:inc-exp};
  });
  const totalInc=md.reduce((s,m)=>s+m.inc,0);
  const totalExp=md.reduce((s,m)=>s+m.exp,0);
  const maxV=Math.max(...md.map(m=>Math.max(m.inc,m.exp)),1);

  return `
  <div class="page-title">📈 年度報表</div>
  <div class="page-sub">${curYear()}年 全年財務分析</div>
  <div class="stat-grid sg3">
    <div class="stat-card green"><div class="stat-label">年度總收入</div><div class="stat-value green">$${fmt(totalInc)}</div></div>
    <div class="stat-card red"><div class="stat-label">年度總支出</div><div class="stat-value red">$${fmt(totalExp)}</div></div>
    <div class="stat-card ${totalInc-totalExp>=0?'blue':'red'}"><div class="stat-label">年度淨結餘</div><div class="stat-value ${totalInc-totalExp>=0?'blue':'red'}">$${fmt(totalInc-totalExp)}</div></div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">📊 月度收支走勢</span></div>
    <div class="card-body" style="overflow-x:auto;">
      <div style="min-width:580px;">
        ${md.map(m=>{
          const ip=Math.round(m.inc/maxV*100), ep=Math.round(m.exp/maxV*100);
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <div style="width:28px;font-size:11px;color:var(--muted);text-align:right;">${m.m}月</div>
            <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
              <div class="progress-bg" style="height:11px;"><div class="progress-fill" style="width:${ip}%;height:11px;background:var(--green);"></div></div>
              <div class="progress-bg" style="height:11px;"><div class="progress-fill" style="width:${ep}%;height:11px;background:var(--red);"></div></div>
            </div>
            <div style="width:90px;font-size:11px;"><div class="amount-pos">$${fmt(m.inc)}</div><div class="amount-neg">$${fmt(m.exp)}</div></div>
            <div style="width:75px;font-size:11px;font-weight:700;${m.net>=0?'color:var(--green)':'color:var(--red)'};">$${fmt(m.net)}</div>
          </div>`;
        }).join('')}
        <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted);">
          <span>🟢 收入</span><span>🔴 支出</span><span>右側為淨結餘</span>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">📋 月度明細表</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>月份</th><th>收入</th><th>支出</th><th>淨結餘</th><th>狀態</th></tr></thead>
      <tbody>${md.map(m=>`<tr>
        <td><b>${m.m}月</b></td>
        <td class="amount-pos">$${fmt(m.inc)}</td>
        <td class="amount-neg">$${fmt(m.exp)}</td>
        <td class="${m.net>=0?'amount-pos':'amount-neg'}">$${fmt(m.net)}</td>
        <td>${m.inc===0&&m.exp===0?'<span class="text-muted">—</span>':m.net>=0?'<span class="pill pill-income">結餘</span>':'<span class="pill pill-expense">超支</span>'}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function incBreakdown(list) {
  const cats={};
  list.forEach(i=>{cats[i.category]=(cats[i.category]||0)+toNum(i.amount);});
  const total=Object.values(cats).reduce((s,v)=>s+v,0);
  if(!total) return '<div class="empty" style="padding:10px 0;"><p>新增收入後查看分析</p></div>';
  return Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{
    const pct=Math.round(v/total*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <div style="width:90px;font-size:12px;color:var(--muted);text-align:right;">${c}</div>
      <div class="progress-bg" style="flex:1;height:13px;"><div class="progress-fill" style="width:${pct}%;height:13px;background:var(--green);"></div></div>
      <div style="width:110px;font-size:12px;font-weight:700;color:var(--brown);">$${fmt(v)}（${pct}%）</div>
    </div>`;
  }).join('');
}

function expBreakdown(list) {
  const cats={};
  list.forEach(e=>{cats[e.category]=(cats[e.category]||0)+toNum(e.amount);});
  const total=Object.values(cats).reduce((s,v)=>s+v,0);
  if(!total) return '<div class="empty" style="padding:10px 0;"><p>新增支出後查看分析</p></div>';
  return Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{
    const pct=Math.round(v/total*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <div style="width:90px;font-size:12px;color:var(--muted);text-align:right;">${c}</div>
      <div class="progress-bg" style="flex:1;height:13px;"><div class="progress-fill" style="width:${pct}%;height:13px;background:var(--red);"></div></div>
      <div style="width:110px;font-size:12px;font-weight:700;color:var(--brown);">$${fmt(v)}（${pct}%）</div>
    </div>`;
  }).join('');
}

    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="updateDream('${dr.id}')">✓ 更新</button>
    </div>`;
  }

  return `<div class="modal-backdrop" onclick="backdropClose(event)">
    <div class="modal-box">${content}</div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════
// ACTIONS — exposed to window
// ══════════════════════════════════════════════════════════════
window.tryLogin = () => {
  const pw = document.getElementById('pwInput')?.value;
  if (pw === FAMILY_PASSWORD) {
    S.loggedIn = true;
    sessionStorage.setItem('hf_auth','1');
    render();
  } else {
    document.getElementById('pwError').textContent = '密碼錯誤，請再試一次';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
};
window.logout = () => { S.loggedIn=false; sessionStorage.removeItem('hf_auth'); render(); };
window.setUser = u => { S.user=u; render(); };
window.setPage = p => { S.page=p; S.subTab=0; render(); };
window.setMonth = m => { S.month=m; render(); };
window.setSubTab = t => { S.subTab=t; render(); };
window.openModal = (type,extra) => { S.modal={type,defaultMethod:extra,id:extra}; render(); };
window.closeModal = () => { S.modal=null; render(); };
window.backdropClose = e => { if(e.target===e.currentTarget) closeModal(); };
window.toggleCardFields = () => {
  const v = document.getElementById('m_method')?.value==='信用卡';
  const bg=document.getElementById('cardBankG'), cg=document.getElementById('cardCatG');
  if(bg) bg.style.display=v?'':'none';
  if(cg) cg.style.display=v?'':'none';
};

// ── SAVE ACTIONS ─────────────────────────────────────────────
window.saveIncome = async () => {
  const date=document.getElementById('m_date')?.value;
  const amount=document.getElementById('m_amount')?.value;
  const cat=document.getElementById('m_cat')?.value;
  const passive=document.getElementById('m_passive')?.value==='1';
  const user=document.getElementById('m_user')?.value;
  const note=document.getElementById('m_note')?.value;
  if(!date||!amount){ alert('請填日期和金額'); return; }
  const d=new Date(date);
  await addSubDoc('incomes',{date,amount:toNum(amount),category:cat,isPassive:passive,user,note,month:d.getMonth()+1,year:d.getFullYear()});
  showToast('✅ 收入已記錄');
  closeModal();
};

window.saveExpense = async () => {
  const date=document.getElementById('m_date')?.value;
  const amount=document.getElementById('m_amount')?.value;
  const cat=document.getElementById('m_cat')?.value;
  const budgetCat=document.getElementById('m_budgetcat')?.value;
  const method=document.getElementById('m_method')?.value;
  const cardBank=method==='信用卡'?document.getElementById('m_cardBank')?.value:'';
  const cardCategory=method==='信用卡'?document.getElementById('m_cardCat')?.value:'';
  const user=document.getElementById('m_user')?.value;
  const note=document.getElementById('m_note')?.value;
  if(!date||!amount){ alert('請填日期和金額'); return; }
  const d=new Date(date);
  await addSubDoc('expenses',{date,amount:toNum(amount),category:cat,budgetCat,payMethod:method,cardBank,cardCategory,user,note,month:d.getMonth()+1,year:d.getFullYear()});
  showToast('✅ 支出已記帳');
  closeModal();
};

window.saveAsset = async () => {
  const name=document.getElementById('m_name')?.value;
  const type=document.getElementById('m_type')?.value;
  const value=document.getElementById('m_value')?.value;
  const note=document.getElementById('m_note')?.value;
  if(!name||!value){ alert('請填名稱和現值'); return; }
  const assets=[...(S.data.assets||[]),{id:uid(),name,type,value:toNum(value),note}];
  await saveMainDoc({assets});
  showToast('✅ 資產已新增');
  closeModal();
};

window.saveDebt = async () => {
  const name=document.getElementById('m_name')?.value;
  const type=document.getElementById('m_type')?.value;
  const remaining=document.getElementById('m_remaining')?.value;
  const monthly=document.getElementById('m_monthly')?.value;
  const rate=document.getElementById('m_rate')?.value;
  const note=document.getElementById('m_note')?.value;
  if(!name){ alert('請填名稱'); return; }
  const debts=[...(S.data.debts||[]),{id:uid(),name,type,remainingAmount:toNum(remaining),monthlyPayment:toNum(monthly),rate:toNum(rate),note}];
  await saveMainDoc({debts});
  showToast('✅ 負債已新增');
  closeModal();
};

window.saveDream = async () => {
  const name=document.getElementById('m_name')?.value;
  const icon=document.getElementById('m_icon')?.value;
  const target=document.getElementById('m_target')?.value;
  const saved=document.getElementById('m_saved')?.value;
  const deadline=document.getElementById('m_deadline')?.value;
  const note=document.getElementById('m_note')?.value;
  if(!name||!target){ alert('請填名稱和目標金額'); return; }
  const dreams=[...(S.data.dreams||[]),{id:uid(),name,icon,targetAmount:toNum(target),savedAmount:toNum(saved||0),deadline,note}];
  await saveMainDoc({dreams});
  showToast('✅ 夢想計畫已新增');
  closeModal();
};

window.updateDream = async (id) => {
  const dreams=(S.data.dreams||[]).map(d=>d.id===id?{...d,
    targetAmount:toNum(document.getElementById('m_target')?.value),
    savedAmount:toNum(document.getElementById('m_saved')?.value),
    deadline:document.getElementById('m_deadline')?.value,
    note:document.getElementById('m_note')?.value
  }:d);
  await saveMainDoc({dreams});
  showToast('✅ 夢想進度已更新');
  closeModal();
};

window.saveBudget = async (cat, val) => {
  const k=mKey();
  const budgets={...(S.data.budgets||{})};
  if(!budgets[k]) budgets[k]={};
  budgets[k][cat]=toNum(val);
  await saveMainDoc({budgets});
};

// ── DELETE ACTIONS ────────────────────────────────────────────
window.doDelAsset = async id => {
  if(!confirm('確認刪除此資產？')) return;
  await saveMainDoc({assets:(S.data.assets||[]).filter(a=>a.id!==id)});
  showToast('已刪除');
};
window.doDelDebt = async id => {
  if(!confirm('確認刪除此負債？')) return;
  await saveMainDoc({debts:(S.data.debts||[]).filter(d=>d.id!==id)});
  showToast('已刪除');
};
window.doDelIncome = async id => {
  if(!confirm('確認刪除？')) return;
  await delSubDoc('incomes',id);
  showToast('已刪除');
};
window.doDelExpense = async id => {
  if(!confirm('確認刪除？')) return;
  await delSubDoc('expenses',id);
  showToast('已刪除');
};
window.doDelDream = async id => {
  if(!confirm('確認刪除此夢想計畫？')) return;
  await saveMainDoc({dreams:(S.data.dreams||[]).filter(d=>d.id!==id)});
  showToast('已刪除');
};

function bindEvents() {}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
(async function init() {
  // Check session
  if (sessionStorage.getItem('hf_auth')==='1') S.loggedIn = true;
  // Start Firebase realtime sync
  startRealtimeSync();
  // Show login or app immediately
  if (!S.loggedIn) {
    document.getElementById('loadingScreen').style.display='none';
    document.getElementById('app').style.display='block';
    renderLogin();
  }
})();
</script>
