<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🌸 家庭財務</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#C2747A;--roseDk:#9E5A60;--roseL:#F5E8EA;--roseMid:#E8C4C8;
  --gold:#C4A46B;--goldL:#F9F0E0;--goldDk:#8C6B3A;
  --grn:#5A8C6B;--grnL:#E8F5ED;--red:#C25A5A;--redL:#FAEAEA;
  --blu:#5A7AC2;--bluL:#E8EEFA;--pur:#8C5AC2;--purL:#F0E8FA;
  --brown:#6B4C3A;--txt:#2D1F1A;--mut:#7E6860;--bdr:#EAE0D8;
  --bg:#FDFAF8;--bg2:#F7F0EC;--bg3:#F0E8E2;--card:#FFFFFF;
  --shadow:0 2px 16px rgba(180,100,100,0.08);
  --shadow2:0 4px 32px rgba(180,100,100,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:0.04em;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);font-size:17px;min-height:100vh;line-height:1.65;}
h1,h2,h3{font-family:'Noto Serif TC',serif;letter-spacing:0.08em;}

.app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:linear-gradient(180deg,var(--roseDk) 0%,var(--brown) 100%);padding:14px 0;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;}
.sb-logo{padding:18px 20px 22px;border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:8px;}
.sb-logo-ico{font-size:32px;margin-bottom:4px;}
.sb-logo-txt{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:900;color:#fff;letter-spacing:0.12em;}
.sb-logo-sub{font-size:12px;color:rgba(255,255,255,0.6);letter-spacing:0.08em;margin-top:2px;}
.sb-item{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;transition:.2s;color:rgba(255,255,255,0.78);font-size:16px;border-left:4px solid transparent;letter-spacing:0.06em;}
.sb-item:hover{background:rgba(255,255,255,0.1);color:#fff;}
.sb-item.active{background:rgba(255,255,255,0.18);color:#fff;border-left-color:var(--gold);font-weight:700;}
.sb-item .ico{font-size:20px;width:26px;text-align:center;}

.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--card);border-bottom:1px solid var(--bdr);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.tb-ttl{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--roseDk);letter-spacing:0.08em;}
.tb-right{display:flex;align-items:center;gap:12px;}
.btn-out{background:none;border:1.5px solid var(--bdr);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--mut);transition:.2s;letter-spacing:0.06em;font-family:'Noto Sans TC',sans-serif;}
.btn-out:hover{border-color:var(--rose);color:var(--roseDk);}

.content{padding:28px;flex:1;}
.pg-ttl{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;color:var(--roseDk);margin-bottom:6px;letter-spacing:0.1em;}
.pg-sub{font-size:14px;color:var(--mut);margin-bottom:24px;letter-spacing:0.08em;}

/* CARDS */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bdr);gap:12px;flex-wrap:wrap;}
.card-ttl{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--brown);letter-spacing:0.08em;}
.card-bd{padding:18px 20px;}

/* STAT GRID */
.sg{display:grid;gap:14px;margin-bottom:18px;}
.sg2{grid-template-columns:repeat(2,1fr);}
.sg3{grid-template-columns:repeat(3,1fr);}
.sg4{grid-template-columns:repeat(4,1fr);}
.sg7{grid-template-columns:repeat(7,1fr);}
.sc{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--bdr);}
.sc.rose{border-top-color:var(--rose);}
.sc.grn{border-top-color:var(--grn);}
.sc.red{border-top-color:var(--red);}
.sc.gold{border-top-color:var(--gold);}
.sc.blu{border-top-color:var(--blu);}
.sc.pur{border-top-color:var(--pur);}
.sc.brown{border-top-color:var(--brown);}
.sl{font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:500;letter-spacing:0.06em;}
.sv{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700;color:var(--txt);letter-spacing:0.04em;}
.sv.sm{font-size:18px;}
.sv.rose{color:var(--rose);}
.sv.grn{color:var(--grn);}
.sv.red{color:var(--red);}
.sv.gold{color:var(--gold);}
.sv.blu{color:var(--blu);}
.sv.pur{color:var(--pur);}
.ss{font-size:12px;color:var(--mut);margin-top:4px;letter-spacing:0.04em;}

/* TABLES */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:15px;}
th{background:var(--bg2);padding:12px 14px;text-align:left;font-size:13px;font-weight:700;color:var(--mut);border-bottom:1px solid var(--bdr);white-space:nowrap;letter-spacing:0.08em;}
td{padding:13px 14px;border-bottom:1px solid var(--bdr);vertical-align:middle;letter-spacing:0.04em;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg);}

/* BADGES */
.bdg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600;letter-spacing:0.04em;}
.bdg.rose{background:var(--roseL);color:var(--roseDk);}
.bdg.grn{background:var(--grnL);color:var(--grn);}
.bdg.red{background:var(--redL);color:var(--red);}
.bdg.gold{background:var(--goldL);color:var(--goldDk);}
.bdg.blu{background:var(--bluL);color:var(--blu);}
.bdg.pur{background:var(--purL);color:var(--pur);}

/* BUTTONS */
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:600;transition:.2s;letter-spacing:0.08em;}
.btn-p{background:linear-gradient(135deg,var(--rose),var(--roseDk));color:#fff;}
.btn-p:hover{opacity:.9;transform:translateY(-1px);}
.btn-s{background:var(--bg2);color:var(--brown);border:1.5px solid var(--bdr);}
.btn-s:hover{border-color:var(--rose);color:var(--roseDk);}
.btn-g{background:linear-gradient(135deg,var(--grn),#3a6b4c);color:#fff;}
.btn-sm{padding:7px 14px;font-size:14px;}
.bdel{background:none;border:none;color:var(--mut);cursor:pointer;padding:5px 8px;border-radius:6px;font-size:18px;transition:.2s;}
.bdel:hover{background:var(--redL);color:var(--red);}

/* PROGRESS */
.pb{background:var(--bg2);border-radius:10px;overflow:hidden;}
.pf{border-radius:10px;transition:width .4s ease;background:linear-gradient(90deg,var(--rose),var(--gold));}
.plbl{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:7px;letter-spacing:0.04em;}

/* FORMS */
.fg{display:grid;gap:16px;}
.fg2{grid-template-columns:1fr 1fr;}
.fgrp{display:flex;flex-direction:column;gap:6px;}
.fgrp label{font-size:14px;font-weight:600;color:var(--brown);letter-spacing:0.06em;}
.fgrp input,.fgrp select,.fgrp textarea{
  border:1.5px solid var(--bdr);border-radius:8px;padding:11px 14px;font-size:15px;
  font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);transition:.2s;width:100%;letter-spacing:0.04em;}
.fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{outline:none;border-color:var(--rose);background:#fff;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(45,31,26,0.5);z-index:1000;backdrop-filter:blur(4px);}
.modal-bg.open{display:flex;align-items:center;justify-content:center;}
.modal{background:var(--card);border-radius:18px;padding:30px;width:92%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2);}
.mttl{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;color:var(--roseDk);margin-bottom:22px;letter-spacing:0.08em;}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap;}

/* MISC */
.mo-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px;scrollbar-width:none;}
.mo-scroll::-webkit-scrollbar{display:none;}
.mo-btn{padding:8px 16px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--card);font-size:14px;cursor:pointer;white-space:nowrap;transition:.2s;color:var(--mut);letter-spacing:0.06em;font-family:'Noto Sans TC',sans-serif;}
.mo-btn.active{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-ttl{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--brown);letter-spacing:0.08em;}
.empty{text-align:center;padding:44px 20px;color:var(--mut);}
.empty-ico{font-size:44px;margin-bottom:14px;}
.notice{background:var(--roseL);border-left:4px solid var(--rose);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--roseDk);margin-bottom:18px;letter-spacing:0.04em;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--brown);color:#fff;padding:14px 22px;border-radius:12px;font-size:15px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;letter-spacing:0.06em;}
.toast.show{opacity:1;transform:translateY(0);}

/* QUICK ADD ROW */
.quick-add{display:flex;gap:8px;align-items:flex-end;padding:14px 20px;background:var(--bg2);border-top:1px solid var(--bdr);flex-wrap:wrap;}
.quick-add .fgrp{gap:4px;min-width:0;}
.quick-add .fgrp label{font-size:12px;}
.quick-add .fgrp input,.quick-add .fgrp select{padding:8px 10px;font-size:14px;}
.qa-date{width:128px;}
.qa-cat{width:120px;}
.qa-note{flex:1;min-width:120px;}
.qa-amt{width:110px;}
.qa-card{width:100px;}
.qa-rem{width:120px;}

/* RECON */
.recon-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr);}
.recon-row:last-child{border-bottom:none;}
.recon-card{font-size:14px;font-weight:700;width:48px;}
.recon-rec{font-size:13px;color:var(--mut);flex:1;}
.recon-inp{border:1.5px solid var(--bdr);border-radius:8px;padding:7px 10px;font-size:14px;width:110px;font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);transition:.2s;}
.recon-inp:focus{outline:none;border-color:var(--rose);}
.recon-st{font-size:20px;width:28px;text-align:center;}

/* CAT BAR */
.cat-bar-row{margin-bottom:12px;}
.cat-bar-hd{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;}
.cat-bar-nm{color:var(--brown);font-weight:600;}
.cat-bar-amt{color:var(--mut);}
.pb5{background:var(--bg2);border-radius:10px;height:6px;overflow:hidden;}
.pf5{height:6px;border-radius:10px;transition:width .4s ease;}

@media(max-width:768px){
  .sidebar{width:64px;}
  .sb-item span:last-child{display:none;}
  .sb-item{padding:14px;justify-content:center;}
  .sb-logo-txt,.sb-logo-sub{display:none;}
  .sb-logo{padding:12px;text-align:center;}
  .main{margin-left:64px;}
  .sg4,.sg7{grid-template-columns:repeat(2,1fr);}
  .sg3{grid-template-columns:1fr;}
  .sg2{grid-template-columns:1fr;}
  .fg2{grid-template-columns:1fr;}
  .pg-ttl{font-size:22px;}
  .content{padding:16px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-inner"></div>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const CARDS = ["星展","富邦","國泰","台新","中信","永豐"];
const CATEGORIES = ["交通","購物","住家購物","飲食","愛美基金","通訊","女兒","其他"];
const MOS = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
const CARD_COLORS = {
  "星展":"rose","富邦":"grn","國泰":"blu","台新":"gold","中信":"pur","永豐":"red"
};
const CARD_HEX = {
  "星展":"#C2747A","富邦":"#5A8C6B","國泰":"#5A7AC2","台新":"#C4A46B","中信":"#8C5AC2","永豐":"#C25A5A"
};
const CAT_COLORS = {
  "交通":"#5A7AC2","購物":"#C4A46B","住家購物":"#C2747A",
  "飲食":"#5A8C6B","愛美基金":"#8C5AC2","通訊":"#6B4C3A",
  "女兒":"#C4A46B","其他":"#7E6860"
};
const PAGES = [
  {id:'overview', ico:'📊', lbl:'總覽'},
  {id:'txs',      ico:'💳', lbl:'消費明細'},
  {id:'category', ico:'📂', lbl:'類別統計'},
  {id:'cards',    ico:'💎', lbl:'信用卡統計'},
  {id:'recon',    ico:'✅', lbl:'帳務核對'},
  {id:'annual',   ico:'📈', lbl:'年度總覽'},
];

// ── STATE ────────────────────────────────────────────────────────────────────
let S = {
  page: 'overview',
  month: new Date().getMonth() + 1,
  modal: null,
  data: {}, // { "2025-1": [{id,date,cat,note,amt,card,remark},...] }
  recon: {}, // { "2025-1": { "星展": 0, ... } }
  budget: {}, // { "2025-1": 30000 }
};

const yr = () => new Date().getFullYear();
const mk = (m) => `${yr()}-${m || S.month}`;
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const today = () => new Date().toISOString().slice(0, 10);
const fmt = v => { const n = parseFloat(String(v||0).replace(/,/g,''))||0; return n ? n.toLocaleString('zh-TW') : '0'; };
const toN = v => parseFloat(String(v||0).replace(/,/g,''))||0;

function getTxs(m) { return S.data[mk(m)] || []; }
function setTxs(arr, m) { S.data[mk(m)] = arr; save(); }
function getRecon(m) { return S.recon[mk(m)] || {}; }
function setRecon(obj, m) { S.recon[mk(m)] = obj; save(); }
function getBudget(m) { return S.budget[mk(m)] || 30000; }

// ── STORAGE ──────────────────────────────────────────────────────────────────
function save() {
  try {
    localStorage.setItem('mumei_cc_data', JSON.stringify(S.data));
    localStorage.setItem('mumei_cc_recon', JSON.stringify(S.recon));
    localStorage.setItem('mumei_cc_budget', JSON.stringify(S.budget));
  } catch(e) {}
}
function load() {
  try {
    const d = localStorage.getItem('mumei_cc_data') || localStorage.getItem('ccdata');
    const r = localStorage.getItem('mumei_cc_recon') || localStorage.getItem('ccrecon');
    const b = localStorage.getItem('mumei_cc_budget');
    if (d) {
      const parsed = JSON.parse(d);
      // 舊格式：key 是 "0"~"11"（月份 index），新格式是 "2025-1"~"2025-12"
      // 自動轉換舊格式
      const isOldFormat = Object.keys(parsed).some(k => /^\d$|^\d{1,2}$/.test(k) && parseInt(k) < 12);
      if (isOldFormat) {
        const converted = {};
        Object.entries(parsed).forEach(([k, v]) => {
          const newKey = `${yr()}-${parseInt(k)+1}`;
          converted[newKey] = v;
        });
        S.data = converted;
        save(); // 存成新格式
      } else {
        S.data = parsed;
      }
    }
    if (r) S.recon = JSON.parse(r);
    if (b) S.budget = JSON.parse(b);
  } catch(e) {}
}

// ── TOAST ────────────────────────────────────────────────────────────────────
const toast = msg => {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2800);
};

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = appHTML();
  bindEvents();
}

function appHTML() {
  const cur = PAGES.find(p => p.id === S.page) || PAGES[0];
  return `
<div class="app">
  <nav class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-ico">🌸</div>
      <div class="sb-logo-txt">項沐蜜財務</div>
      <div class="sb-logo-sub">家庭信用卡管理</div>
    </div>
    ${PAGES.map(p => `<div class="sb-item${S.page===p.id?' active':''}" onclick="setP('${p.id}')">
      <span class="ico">${p.ico}</span><span>${p.lbl}</span>
    </div>`).join('')}
  </nav>
  <div class="main">
    <div class="topbar">
      <span class="tb-ttl">${cur.ico} ${cur.lbl}</span>
      <div class="tb-right">
        <button class="btn-out" onclick="exportCSV()">⬇ 匯出 CSV</button>
      </div>
    </div>
    <div class="content">${renderPage()}</div>
  </div>
</div>`;
}

function renderPage() {
  switch(S.page) {
    case 'overview':  return pgOverview();
    case 'txs':       return pgTxs();
    case 'category':  return pgCategory();
    case 'cards':     return pgCards();
    case 'recon':     return pgRecon();
    case 'annual':    return pgAnnual();
    default:          return pgOverview();
  }
}

function moSel() {
  return `<div class="mo-scroll">${MOS.map((m,i) =>
    `<button class="mo-btn${S.month===i+1?' active':''}" onclick="setMo(${i+1})">${m}</button>`
  ).join('')}</div>`;
}

// ── OVERVIEW ─────────────────────────────────────────────────────────────────
function pgOverview() {
  const txs = getTxs();
  const total = txs.reduce((s,t) => s + toN(t.amt), 0);
  const budget = getBudget();
  const pct = budget ? Math.min(100, Math.round(total/budget*100)) : 0;
  const rem = budget - total;
  const catTotals = {};
  CATEGORIES.forEach(c => catTotals[c] = txs.filter(t=>t.cat===c).reduce((s,t)=>s+toN(t.amt),0));
  const topCat = Object.entries(catTotals).sort((a,b)=>b[1]-a[1])[0];

  return `
<div class="pg-ttl">總覽</div>
<div class="pg-sub">${yr()} 年 ${MOS[S.month-1]}・家庭信用卡消費概況</div>
${moSel()}

<div class="sg sg4">
  <div class="sc rose">
    <div class="sl">本月總支出</div>
    <div class="sv rose">$${fmt(total)}</div>
    <div class="ss">${txs.length} 筆消費</div>
  </div>
  <div class="sc grn">
    <div class="sl">月份預算</div>
    <div class="sv grn" contenteditable="true" onblur="saveBudget(this.textContent)" style="outline:none;cursor:text;" title="點擊編輯">$${fmt(budget)}</div>
    <div class="ss">點擊可修改</div>
  </div>
  <div class="sc ${rem>=0?'blu':'red'}">
    <div class="sl">剩餘預算</div>
    <div class="sv ${rem>=0?'blu':'red'}">${rem>=0?'$'+fmt(rem):'－$'+fmt(Math.abs(rem))}</div>
    <div class="ss">${pct}% 已使用</div>
  </div>
  <div class="sc gold">
    <div class="sl">最高類別</div>
    <div class="sv gold sm">${topCat ? topCat[0] : '—'}</div>
    <div class="ss">${topCat ? '$'+fmt(topCat[1]) : '尚無資料'}</div>
  </div>
</div>

<div class="card">
  <div class="card-hd"><span class="card-ttl">預算使用進度</span><span style="font-size:14px;color:var(--mut)">${pct}%</span></div>
  <div class="card-bd">
    <div class="pb" style="height:10px"><div class="pf" style="width:${pct}%;height:10px"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px;">
      <span>已用 $${fmt(total)}</span><span>預算 $${fmt(budget)}</span>
    </div>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
  <div class="card">
    <div class="card-hd"><span class="card-ttl">各信用卡本月</span></div>
    <div class="card-bd" style="padding:12px 20px;">
      ${CARDS.map(card => {
        const sum = txs.filter(t=>t.card===card).reduce((s,t)=>s+toN(t.amt),0);
        const p = total ? Math.round(sum/total*100) : 0;
        return `<div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;">

        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-hd"><span class="card-ttl">各類別本月</span></div>
    <div class="card-bd" style="padding:12px 20px;">
      ${CATEGORIES.filter(c=>catTotals[c]>0).sort((a,b)=>catTotals[b]-catTotals[a]).slice(0,6).map(cat => {

        const p = total ? Math.round(sum/total*100) : 0;
        return `<div style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;">
            <span style="font-weight:700;color:${CAT_COLORS[cat]}">${cat}</span>

      }).join('') || '<div class="empty"><div class="empty-ico">📭</div><p>本月尚無資料</p></div>'}
    </div>
  </div>
</div>

<div class="card">
  <div class="card-hd"><span class="card-ttl">最近 5 筆消費</span>
    <button class="btn btn-s btn-sm" onclick="setP('txs')">查看全部</button>
  </div>
  <div class="card-bd" style="padding:0">
    ${txs.length === 0
      ? '<div class="empty"><div class="empty-ico">💳</div><p>尚無消費記錄</p></div>'
      : `<div class="tw"><table>
          <thead><tr><th>日期</th><th>類別</th><th>細項</th><th>金額</th><th>信用卡</th></tr></thead>

// ── TRANSACTIONS ─────────────────────────────────────────────────────────────
function pgTxs() {
  const txs = getTxs();

  return `
<div class="pg-ttl">消費明細</div>
<div class="pg-sub">${yr()} 年 ${MOS[S.month-1]}・直接在下方新增消費</div>
${moSel()}

<div class="card">
  <div class="card-hd">
    <span class="card-ttl">💳 ${MOS[S.month-1]} 消費明細</span>
    <span style="font-size:14px;color:var(--mut)">${txs.length} 筆 ／ 合計 $${fmt(txs.reduce((s,t)=>s+toN(t.amt),0))}</span>
  </div>
  <div class="tw">
    <table>
      <thead>
        <tr><th>日期</th><th>類別</th><th>細項</th><th style="text-align:right">金額</th><th>信用卡</th><th>備註</th><th></th></tr>
      </thead>
      <tbody>
        ${txs.length === 0
          ? `<tr><td colspan="7"><div class="empty"><div class="empty-ico">📭</div><p>尚無記錄，從下方新增</p></div></td></tr>`
          : [...txs].reverse().map(t => `<tr>
              <td style="color:var(--mut);font-size:13px">${t.date||''}</td>
              <td><span class="bdg" style="background:${CAT_COLORS[t.cat]||'#eee'}22;color:${CAT_COLORS[t.cat]||'var(--mut)'}">${t.cat||'—'}</span></td>
              <td>${t.note||''}</td>
              <td style="text-align:right;font-weight:700;color:var(--roseDk)">$${fmt(t.amt)}</td>
              <td><span class="bdg ${CARD_COLORS[t.card]||''}">${t.card||'—'}</span></td>
              <td style="font-size:13px;color:var(--mut)">${t.remark||''}</td>
              <td><button class="bdel" onclick="delTx('${t.id}')">✕</button></td>

      </tbody>
    </table>
  </div>
  <div class="quick-add">

    <div class="fgrp qa-cat"><label>類別</label><select id="qa_cat"><option value="">選擇類別</option>${catOpts}</select></div>
    <div class="fgrp qa-note"><label>細項</label><input type="text" id="qa_note" placeholder="店名或說明"></div>
    <div class="fgrp qa-amt"><label>金額</label><input type="number" id="qa_amt" placeholder="0" min="0"></div>
    <div class="fgrp qa-card"><label>信用卡</label><select id="qa_card"><option value="">選擇</option>${cardOpts}</select></div>
    <div class="fgrp qa-rem"><label>備註</label><input type="text" id="qa_rem" placeholder="（選填）"></div>
    <button class="btn btn-p btn-sm" style="margin-bottom:1px" onclick="addTx()">＋ 新增</button>
  </div>
</div>`;
}

// ── CATEGORY ─────────────────────────────────────────────────────────────────
function pgCategory() {
  const txs = getTxs();
  const total = txs.reduce((s,t)=>s+toN(t.amt),0);

  return `
<div class="pg-ttl">類別統計</div>
<div class="pg-sub">${yr()} 年 ${MOS[S.month-1]}・各類別消費分析</div>
${moSel()}

<div class="sg sg3">
  ${CATEGORIES.map(cat => {
    const sum = txs.filter(t=>t.cat===cat).reduce((s,t)=>s+toN(t.amt),0);
    const p = total ? Math.round(sum/total*100) : 0;
    const rows = txs.filter(t=>t.cat===cat).sort((a,b)=>(b.amt||0)-(a.amt||0));
    return `<div class="sc" style="border-top-color:${CAT_COLORS[cat]}">
      <div class="sl">${cat}</div>
      <div class="sv sm" style="color:${CAT_COLORS[cat]}">$${fmt(sum)}</div>
      <div class="ss">${rows.length} 筆・佔 ${p}%</div>
      <div class="pb5" style="margin-top:10px"><div class="pf5" style="width:${p}%;background:${CAT_COLORS[cat]}"></div></div>
    </div>`;
  }).join('')}
</div>

<div class="card">
  <div class="card-hd"><span class="card-ttl">各類別消費明細</span></div>
  <div class="card-bd" style="padding:0">
    ${CATEGORIES.map(cat => {
      const rows = txs.filter(t=>t.cat===cat);
      if (!rows.length) return '';
      const sum = rows.reduce((s,t)=>s+toN(t.amt),0);
      return `<div style="border-bottom:1px solid var(--bdr);">
        <div style="padding:14px 20px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;">
          <span style="font-family:'Noto Serif TC',serif;font-weight:700;color:${CAT_COLORS[cat]}">${cat}</span>
          <span style="font-weight:700;color:var(--txt)">$${fmt(sum)}</span>
        </div>
        <div class="tw"><table>
          <thead><tr><th>日期</th><th>細項</th><th style="text-align:right">金額</th><th>信用卡</th></tr></thead>
          <tbody>${rows.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>`<tr>
            <td style="color:var(--mut);font-size:13px">${t.date||''}</td>
            <td>${t.note||''}</td>
            <td style="text-align:right;font-weight:700;color:var(--roseDk)">$${fmt(t.amt)}</td>
            <td><span class="bdg ${CARD_COLORS[t.card]||''}">${t.card||'—'}</span></td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    }).join('') || '<div class="empty"><div class="empty-ico">📂</div><p>本月尚無資料</p></div>'}
  </div>
</div>`;
}

// ── CARDS PAGE ────────────────────────────────────────────────────────────────
function pgCards() {
  const txs = getTxs();
  const total = txs.reduce((s,t)=>s+toN(t.amt),0);

  return `
<div class="pg-ttl">信用卡統計</div>
<div class="pg-sub">${yr()} 年 ${MOS[S.month-1]}・各信用卡使用分析</div>
${moSel()}

<div class="sg sg3">
  ${CARDS.map((card,i) => {

<div class="card">
  <div class="card-hd"><span class="card-ttl">各卡消費明細</span></div>
  <div class="card-bd" style="padding:0">
    ${CARDS.map(card => {
      const rows = txs.filter(t=>t.card===card);
      if (!rows.length) return '';
      const sum = rows.reduce((s,t)=>s+toN(t.amt),0);

        <div style="padding:14px 20px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;">
          <span style="font-family:'Noto Serif TC',serif;font-weight:700;color:${CARD_HEX[card]}">${card}</span>
          <span style="font-weight:700">$${fmt(sum)}</span>
        </div>
        <div class="tw"><table>
          <thead><tr><th>日期</th><th>類別</th><th>細項</th><th style="text-align:right">金額</th></tr></thead>
          <tbody>${rows.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>`<tr>
            <td style="color:var(--mut);font-size:13px">${t.date||''}</td>
            <td><span class="bdg" style="background:${CAT_COLORS[t.cat]||'#eee'}22;color:${CAT_COLORS[t.cat]||'var(--mut)'}">${t.cat||'—'}</span></td>
            <td>${t.note||''}</td>
            <td style="text-align:right;font-weight:700;color:var(--roseDk)">$${fmt(t.amt)}</td>
          </tr>`).join('')}</tbody>
        </table></div>

  </div>
</div>`;
}

// ── RECONCILE ────────────────────────────────────────────────────────────────
function pgRecon() {
  const txs = getTxs();
  const recon = getRecon();

  return `
<div class="pg-ttl">帳務核對</div>
<div class="pg-sub">${yr()} 年 ${MOS[S.month-1]}・對照銀行帳單，確認記錄正確</div>
${moSel()}

<div class="notice">💡 請輸入各信用卡銀行帳單金額，系統自動與消費記錄比對</div>

<div class="card">
  <div class="card-hd"><span class="card-ttl">帳單核對表</span></div>
  <div class="card-bd">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;font-size:13px;font-weight:700;color:var(--mut);padding:0 0 10px;border-bottom:1px solid var(--bdr);margin-bottom:4px;">
      <span>信用卡</span><span style="text-align:right">帳單金額</span><span style="text-align:right">記錄金額</span><span style="text-align:right">差異</span><span style="text-align:center">狀態</span>
    </div>
    ${CARDS.map(card => {
      const recorded = txs.filter(t=>t.card===card).reduce((s,t)=>s+toN(t.amt),0);
      const bankVal = toN(recon[card] || 0);
      const diff = bankVal - recorded;
      let status = '—', stColor = 'var(--mut)';
      if (bankVal > 0) {
        if (diff === 0) { status = '✅ 正確'; stColor = 'var(--grn)'; }
        else if (diff > 0) { status = '⚠️ 帳單較多'; stColor = 'var(--gold)'; }
        else { status = '❌ 帳單不足'; stColor = 'var(--red)'; }
      }
      return `<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid var(--bdr);">
        <span style="font-weight:700;color:${CARD_HEX[card]}">${card}</span>
        <div style="text-align:right"><input class="recon-inp" type="number" placeholder="0"
          value="${recon[card]||''}"
          oninput="updateRecon('${card}',this.value)"
          style="width:100%;text-align:right"></div>
        <span style="text-align:right;font-weight:700">$${fmt(recorded)}</span>
        <span style="text-align:right;font-weight:700;color:${diff===0?'var(--mut)':diff>0?'var(--red)':'var(--grn)'}">${bankVal>0?(diff>=0?'+':'')+fmt(diff):'—'}</span>
        <span style="text-align:center;font-size:13px;font-weight:700;color:${stColor}">${status}</span>
      </div>`;
    }).join('')}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;padding:14px 0 0;font-weight:700;">
      <span style="color:var(--brown)">合計</span>
      <span style="text-align:right;color:var(--rose)">$${fmt(CARDS.reduce((s,c)=>s+toN(recon[c]||0),0))}</span>
      <span style="text-align:right;color:var(--rose)">$${fmt(txs.reduce((s,t)=>s+toN(t.amt),0))}</span>
      <span></span><span></span>
    </div>
  </div>
</div>`;
}

// ── ANNUAL ───────────────────────────────────────────────────────────────────
function pgAnnual() {
  const annualData = MOS.map((m,i) => {
    const txs = getTxs(i+1);
    const total = txs.reduce((s,t)=>s+toN(t.amt),0);
    const catTotals = {};
    CATEGORIES.forEach(c => catTotals[c] = txs.filter(t=>t.cat===c).reduce((s,t)=>s+toN(t.amt),0));
    const cardTotals = {};
    CARDS.forEach(c => cardTotals[c] = txs.filter(t=>t.card===c).reduce((s,t)=>s+toN(t.amt),0));
    return { month: m, total, catTotals, cardTotals };
  });

  const grandTotal = annualData.reduce((s,d)=>s+d.total,0);
  const maxMonth = annualData.reduce((mx,d)=>d.total>mx.total?d:mx, annualData[0]);

  return `
<div class="pg-ttl">年度總覽</div>
<div class="pg-sub">${yr()} 年・全年信用卡消費統計</div>

<div class="sg sg3">
  <div class="sc rose"><div class="sl">年度總支出</div><div class="sv rose">$${fmt(grandTotal)}</div></div>
  <div class="sc gold"><div class="sl">月均支出</div><div class="sv gold">$${fmt(Math.round(grandTotal/12))}</div></div>
  <div class="sc blu"><div class="sl">最高月份</div><div class="sv blu sm">${maxMonth.month} $${fmt(maxMonth.total)}</div></div>
</div>

<div class="card">
  <div class="card-hd"><span class="card-ttl">月份支出趨勢</span></div>
  <div class="tw">
    <table>
      <thead><tr><th>月份</th>${CATEGORIES.map(c=>`<th style="text-align:right">${c}</th>`).join('')}<th style="text-align:right;color:var(--roseDk)">合計</th></tr></thead>
      <tbody>
        ${annualData.map((d,i) => `<tr style="${S.month===i+1?'background:var(--roseL)':''}">
          <td style="font-weight:700;color:${S.month===i+1?'var(--roseDk)':'var(--brown)'};cursor:pointer" onclick="setMo(${i+1})">${d.month}</td>
          ${CATEGORIES.map(c=>`<td style="text-align:right;font-size:14px;color:var(--mut)">${d.catTotals[c]?'$'+fmt(d.catTotals[c]):'—'}</td>`).join('')}
          <td style="text-align:right;font-weight:700;color:var(--roseDk)">${d.total?'$'+fmt(d.total):'—'}</td>
        </tr>`).join('')}
        <tr style="background:var(--bg2)">
          <td style="font-weight:700;font-family:'Noto Serif TC',serif;color:var(--brown)">年度合計</td>
          ${CATEGORIES.map(c=>{const s=annualData.reduce((t,d)=>t+d.catTotals[c],0);return`<td style="text-align:right;font-weight:700;color:${CAT_COLORS[c]}">${s?'$'+fmt(s):'—'}</td>`;}).join('')}
          <td style="text-align:right;font-weight:700;color:var(--roseDk)">$${fmt(grandTotal)}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="card">
  <div class="card-hd"><span class="card-ttl">各信用卡年度明細</span></div>
  <div class="tw">
    <table>
      <thead><tr><th>月份</th>${CARDS.map(c=>`<th style="text-align:right;color:${CARD_HEX[c]}">${c}</th>`).join('')}<th style="text-align:right">合計</th></tr></thead>
      <tbody>
        ${annualData.map((d,i) => `<tr style="${S.month===i+1?'background:var(--roseL)':''}">
          <td style="font-weight:700;color:${S.month===i+1?'var(--roseDk)':'var(--brown)'};cursor:pointer" onclick="setMo(${i+1})">${d.month}</td>
          ${CARDS.map(c=>`<td style="text-align:right;font-size:14px">${d.cardTotals[c]?'$'+fmt(d.cardTotals[c]):'—'}</td>`).join('')}
          <td style="text-align:right;font-weight:700;color:var(--roseDk)">${d.total?'$'+fmt(d.total):'—'}</td>
        </tr>`).join('')}
        <tr style="background:var(--bg2)">
          <td style="font-weight:700;font-family:'Noto Serif TC',serif;color:var(--brown)">年度合計</td>
          ${CARDS.map(c=>{const s=annualData.reduce((t,d)=>t+d.cardTotals[c],0);return`<td style="text-align:right;font-weight:700;color:${CARD_HEX[c]}">${s?'$'+fmt(s):'—'}</td>`;}).join('')}
          <td style="text-align:right;font-weight:700;color:var(--roseDk)">$${fmt(grandTotal)}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>`;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
window.setP = p => { S.page = p; render(); };
window.setMo = m => { S.month = m; render(); };

window.addTx = () => {
  const date  = document.getElementById('qa_date')?.value || today();
  const cat   = document.getElementById('qa_cat')?.value;
  const note  = document.getElementById('qa_note')?.value.trim();
  const amt   = document.getElementById('qa_amt')?.value;
  const card  = document.getElementById('qa_card')?.value;
  const remark= document.getElementById('qa_rem')?.value.trim();
  if (!amt || !card) { toast('⚠️ 請填入金額與信用卡'); return; }
  const txs = getTxs();
  txs.push({ id: uid(), date, cat, note, amt: parseFloat(amt), card, remark });
  setTxs(txs);
  document.getElementById('qa_amt').value = '';
  document.getElementById('qa_note').value = '';
  document.getElementById('qa_rem').value = '';
  render();
  toast('✅ 已新增消費');
};

window.delTx = id => {
  if (!confirm('確認刪除此筆消費？')) return;
  setTxs(getTxs().filter(t => t.id !== id));
  render();
  toast('已刪除');
};

window.updateRecon = (card, val) => {
  const r = getRecon();
  r[card] = val;
  setRecon(r);
  // re-render just recon section without full render for UX
  render();
};

window.saveBudget = (val) => {
  const n = parseInt(String(val).replace(/[^0-9]/g,''));
  if (!n) return;
  S.budget[mk()] = n;
  save();
  render();
  toast(`✅ 預算已更新為 $${fmt(n)}`);
};

window.exportCSV = () => {
  const txs = getTxs();
  if (!txs.length) { toast('本月無資料'); return; }
  const rows = [['日期','類別','細項','金額','信用卡','備註'],
    ...txs.map(t=>[t.date,t.cat,t.note,t.amt,t.card,t.remark])];
  const csv = rows.map(r=>r.map(v=>'"'+(v||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download = `項沐蜜財務_${MOS[S.month-1]}.csv`;
  a.click();
  toast('✅ CSV 已下載');
};

function bindEvents() {
  // Enter on amount
  const qa = document.getElementById('qa_amt');
  if (qa) qa.addEventListener('keydown', e => { if(e.key==='Enter') addTx(); });
}

// ── INIT ─────────────────────────────────────────────────────────────────────
load();
render();
</script>
</body>
</html>
